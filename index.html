<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harcher Software</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      padding: 2rem;

      background: url('nebulabackground.jpg') no-repeat center center fixed;
      background-size: 200%;
      animation: panBackground 120s linear infinite;
    }

    @keyframes panBackground {
      0% {
        background-position: 0% 0%;
      }
      50% {
        background-position: 100% 100%;
      }
      100% {
        background-position: 0% 0%;
      }
    }

    .logo {
      width: 50%;
      height: auto;
      margin-bottom: 1.5rem;
      transition: all 0.3s ease;
    }

    p {
      font-size: 1.5rem;
      max-width: 600px;
      margin-bottom: 1.5rem;
      margin-top: 1%;
      opacity: 0.9;
      transition: all 0.3s ease;
    }

    .button {
      background-color: rgba(255, 255, 255, 0.76);
      color: #1e3c72;
      padding: 0.75rem 1.5rem;
      margin: 1%;
      font-size: 1.5rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      width: 60%;
      opacity: 1;
    }

    .hidecursor {
      cursor: default;
    }

    .button:hover {
      background-color: rgba(255, 255, 255, 0.4);
      border-radius: 15px;
      width: 90%;
      font-size: 3rem;
      opacity: 0.5;
    }

    p:hover {
      font-size: 2rem;
    }

    .logo:hover {
      width: 55%;
      opacity: 80%;
    }

  </style>
</head>
<body>
  <a href="/nebulahomescreen.html" class="hidecursor"><img src="harcheruklogo.png" alt="Harcher Logo" class="logo"/></a>
  <p>This website hosts all my current projects that are ported to webGL. Other projects are most likely availiable for download via github.</p>
  <a href="/earthsim/earthsim.html" class="button">Unity Earth Sim</a>
  <a href="/tictactoe3d/index.html" class="button">3D Tic Tac Toe</a>
</body>
</html>
